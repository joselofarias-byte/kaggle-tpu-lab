name: Launcher reconciliation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Idle shutdown regression tests
        run: python -m unittest discover -s tests -p 'test_idle_shutdown.py' -v
      - name: Session lifecycle regression tests
        run: python -m unittest discover -s tests -p 'test_launcher_reconciliation.py' -v
      - name: Quick tunnel URL regression
        run: python -m unittest discover -s tests -p 'test_tunnel_url.py' -v
