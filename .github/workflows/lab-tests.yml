name: LLM lab CPU checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: molab/requirements-test.txt
      - run: python -m pip install -r molab/requirements-test.txt
      - name: Compile every tracked Python source and parse notebook JSON
        run: |
          python - <<'PY'
          import json, py_compile, subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if name.endswith('.py'):
                  py_compile.compile(name, doraise=True)
              elif name.endswith('.ipynb'):
                  notebook = json.loads(Path(name).read_text())
                  assert notebook['nbformat'] == 4, name
          PY
      - name: Lint new lab runtime and tooling
        run: ruff check molab/lab.py molab/scripts/molab_inference_api.py molab/scripts/configure_opencode.py molab/scripts/smoke_test_coding_api.py molab/tests tools/probe_accelerators.py tools/tests --select E9,F63,F7,F82
      - name: CPU unit and endpoint tests (no model downloads)
        run: |
          python -m pytest molab/tests tools/tests -q
      - name: Validate marimo notebooks
        run: |
          marimo check molab/jolufasoft_llm_lab.py
          marimo check molab/gpu_smoke_test.py
      - name: Shell syntax
        run: bash -n tools/build_llama_cuda.sh molab/scripts/*.sh
